    <title>Document</title>
    <style>
        #parents{
            height: 100vh;
            border: 2px solid;
            display: grid;
            grid-template-columns: 505px 505px 505px;
            grid-template-rows:300px 300px 300px ;
            gap: 10px;
        }
        .grind{
            border: 2px solid red;
            background-size: cover;
            /* height: 100px;
            width: 100px; */
            transition: 2s;
        }
        .grind:hover{
            transform: scale(1.2);
        }
       img{
        height: 100%;
        width: 100%;
       }
       #a{
        grid-column: 2/3;
        grid-row: 2/3;
       }
       #e{
        /* grid-column-start: 4 ;
        grid-column-end: 5; */
       }
    </style>
</head>
