<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
            /* border: 2px solid black; */
            height: 400px;
            width: 400px;

            transition: 3s;
            transform-style: preserve-3d;
            margin: 51px auto;
            position: relative;



        }

        #main:hover {
            transform: rotateY(180deg);
        }

        #card_a {

            height: 50%;
            width: 100%;
            background-color: blueviolet;
            /* position: relative; */
            z-index: 1;
            position: absolute;
            backface-visibility: hidden;
            /* backface-visibility: hidden lagene prr he rotate krne pr color change hoga ; */

        }

        #card_b {

            height: 50%;
            width: 100%;
            /* background-color: greenyellow; */
            /* position: relative; */
            transform: rotateY(180deg);
            position: absolute;
            /* z-index: 2; */
        }

        img {
            height: 100%;
            width: 100%;
        }
    </style>
</head>

<body>
    <div id="main">
        <div id="card_a"> <img
                src="https://images.unsplash.com/photo-1694007787948-3a68e841a01e?q=80&w=2670&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
                alt=""></div>
        <div id="card_b"> <img
                src="https://images.unsplash.com/photo-1567107989883-d7f4da0b59e6?w=900&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTB8fG1vZGl8ZW58MHx8MHx8fDA%3D"
                alt=""></div>
    </div>
</body>

</html>
