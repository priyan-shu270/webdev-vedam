<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            display: flex; 
            justify-content: center;
            align-items: center;

        }
        #hii{
            display: flex;
            gap: 20px;
        }
        #one{
            height: 70px;
            width: 70px;
           background: linear-gradient(red);
            border-radius: 50%;
            border: 5px solid rgb(152, 231, 6);
            animation-name: ball;
             animation-delay: 0s;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
             transition-timing-function: ease-in;
        }
         #two{
            height: 70px;
            width: 70px;
           background: linear-gradient(rgb(244, 245, 242));
            border-radius: 50%;
            border: 5px solid rgb(152, 231, 6);
            animation-name: ball;
            animation-delay: 0.2s;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
             transition-timing-function: ease-in;
        }
         #three{
            height: 70px;
            width: 70px;
           background: linear-gradient(green);
            border-radius: 50%;
            border: 5px solid rgb(152, 231, 6);
            animation-name: ball;
             animation-delay: 0.4s;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate;
             transition-timing-function: ease-in;
            
        }
        @keyframes ball {
            0%{
                /* transform: translateY(0vw); */
                transform: translateY(25vw) scale(1);
                opacity: 0.5;
            } 
             50%{
                /* transform: translateY(0vw); */
                transform: translateY(35vw) scale(1.3);
                opacity: 1;
            } 
             100%{
                transform: translateY(25vw) scale(1);
               opacity: 0.2;
            }     
        }
    </style>
</head>
<body bgcolor="black">
    <div id="hii">
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    </div>
</body>
</html>
