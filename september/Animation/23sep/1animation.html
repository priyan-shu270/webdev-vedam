<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            height: 300px;
            width: 300px;
            background-color: red;
        }
        div:hover{
            animation-name: anime;
            animation-duration: 3s;
            /* animation-delay: 2s; */

            animation-iteration-count: 2;
            animation-direction: alternate;
            /* alternate lagane se jaha se animation end hoga vhi se chalu ho gyaga  */
        }
        @keyframes anime {
            0%{
                height: 100vh;
                width: 100vw;
                border-radius: 50%;
                background-color: blueviolet;
            }
            25%{
                background-color: black;
                height: 100vh;
                width: 100vw;
                border-radius: 50%;
            }
            50%{
                background-color: greenyellow;
                height: 100vh;
                width: 200vw;

            }
            75%{
                background-color: darkorange;
                height: 100vh;
                width: 400vw;
                border-radius: 50%;
            }
            100%{
                background-color: plum;
                height: 300vh;
                width: 100vw;
                border-radius: 50%;
            }
            
        }
    </style>
</head>
<body>
    <div>

    </div>
</body>
</html>
